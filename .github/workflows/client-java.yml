name: Client (Java)

# Unlike ci.yml's `client` job (the TS client), this workflow is path-filtered: the Java
# client has no in-repo consumer to keep green on every unrelated push, so it only needs to
# run when the contract it's generated from, or the client project itself, changes.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/openapi/openapi.json"
      - "clients/java/**"
      - ".github/workflows/client-java.yml"
  pull_request:
    paths:
      - "backend/openapi/openapi.json"
      - "clients/java/**"
      - ".github/workflows/client-java.yml"
  workflow_dispatch:

concurrency:
  group: client-java-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build / test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: clients/java

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: ./gradlew build
        run: ./gradlew build --no-daemon
        # Regenerates the client from the committed backend/openapi/openapi.json (no running
        # backend needed), compiles it, and runs both the generator's own default tests and
        # the hand-written smoke test (SessionApiSmokeTest) against a local JDK HttpServer stub.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: java-client-test-results
          path: clients/java/build/test-results
          retention-days: 14

      - name: Upload the built jars
        uses: actions/upload-artifact@v7.0.2
        with:
          name: java-client
          path: |
            clients/java/build/libs/*.jar
          retention-days: 14

      - name: Compute the client version
        id: client-version
        run: echo "version=$(./gradlew -q printVersion)" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          VERSION: ${{ steps.client-version.outputs.version }}
        run: |
          GROUP_PATH="ai/kantharos"
          if curl -fsSL \
               -H "Authorization: Bearer ${GITHUB_TOKEN}" \
               "https://maven.pkg.github.com/kantharos-net/certharbor/${GROUP_PATH}/certharbor-client/${VERSION}/certharbor-client-${VERSION}.pom" \
               -o /dev/null; then
            echo "already published at ${VERSION}, publish is idempotent"
          else
            ./gradlew publish --no-daemon
          fi
